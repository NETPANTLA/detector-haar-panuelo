<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Detección facial Haar en tiempo real con OpenCV.js.">
  <title>Detección facial Haar</title>
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <main>
    <h1>Detección facial Haar</h1>
    <p class="subtitle">Detección facial en tiempo real usando OpenCV.js</p>
    <section class="viewer-card">
      <div class="viewer">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="placeholder" class="placeholder">
          <h2>Cámara detenida</h2>
          <p>Presiona el botón para comenzar.</p>
        </div>
        <div class="counter">Detecciones: <strong id="count">0</strong></div>
      </div>
      <div class="actions">
        <p id="status" aria-live="polite">Cargando el detector Haar…</p>
        <button id="cameraButton" disabled>Iniciar cámara</button>
      </div>
      <details>
        <summary>Ajustes del detector</summary>
        <div class="settings">

      <label>
        <span><b>Factor de escala</b><output id="scaleValue">1.03</output></span>
        <input id="scale" type="range" min="1.01" max="1.30" step="0.01" value="1.03">
        <small>Más cerca de 1 revisa más tamaños.</small>
      </label>
      <label>
        <span><b>Confirmaciones</b><output id="neighborsValue">1</output></span>
        <input id="neighbors" type="range" min="0" max="10" step="1" value="1">
        <small>Un valor menor produce más candidatos.</small>
      </label>
      <label>
        <span><b>Tamaño mínimo</b><output id="sizeValue">10 px</output></span>
        <input id="minSize" type="range" min="5" max="100" step="5" value="10">
        <small>Permite incluir patrones más pequeños.</small>
      </label>
          <button id="sensitiveButton" class="secondary">Alta sensibilidad</button>
        </div>
      </details>
    </section>
  </main>

  <footer>La imagen de la cámara se procesa localmente en tu navegador.</footer>
  <script src="app.js?v=7"></script>
  <script async src="opencv.js?v=1" onload="onOpenCvScriptLoaded()" onerror="document.querySelector('#status').textContent='Error al cargar OpenCV.js'"></script>
</body>
</html>
